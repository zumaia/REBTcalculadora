<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REBT Calculator - Circuito</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-primary: #0f0f23; --bg-secondary: #1a1a2e; --bg-card: #16213e; --accent: #00d4ff; --text-primary: #ffffff; --text-secondary: #94a3b8; --text-muted: #64748b; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; margin-bottom: 8px; color: var(--accent); }
        h1 a { color: inherit; text-decoration: none; }
        h2 { color: var(--accent); margin-bottom: 16px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 13px; color: var(--text-secondary); }
        input, select { background: var(--bg-secondary); border: 1px solid var(--text-muted); border-radius: 8px; padding: 10px; color: var(--text-primary); font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: var(--accent); }
        .btn { background: var(--accent); border: none; border-radius: 8px; padding: 12px 24px; color: var(--bg-primary); font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; }
        .result-box { background: var(--bg-secondary); padding: 16px; border-radius: 12px; margin-top: 16px; }
        .result-item { display: flex; justify-content: space-between; padding: 8px 0; }
        .result-label { color: var(--text-secondary); }
        .result-value.highlight { color: var(--accent); font-weight: 600; }
        .nav { display: flex; justify-content: center; gap: 8px; margin-top: 20px; }
        .nav a { background: var(--bg-secondary); padding: 10px 16px; border-radius: 8px; color: var(--text-secondary); text-decoration: none; }
        .header-nav { display: flex; justify-content: center; gap: 4px; margin: 16px 0; flex-wrap: wrap; }
        .header-nav a { background: var(--bg-secondary); padding: 8px 12px; border-radius: 8px; color: var(--text-secondary); text-decoration: none; font-size: 13px; }
        .header-nav a:hover { color: var(--accent); }
        .header-nav a.active { background: var(--accent); color: var(--bg-primary); }
    </style>
</head>
<body>
    <div class="container">
        <h1><a href="/">REBT Calculator</a></h1>
        <nav class="header-nav">
<a href="/vivienda">🏠</a>
<a href="/edificio">🏢</a>
<a href="/circuito" class="active">⚡</a>
<a href="/di">🔌</a>
<a href="/ejercicios">📝</a>
<a href="/proyecto">📋</a>
<a href="/buscar">🔍</a>
</nav>
        <h2>⚡ Cálculo de Circuito</h2>
        
        <form method="POST" action="/calcular-circuito">
            <div class="form-grid">
                <div class="form-group">
                    <label>⚡ Potencia (W)</label>
                    <input type="number" name="potencia" value="2000" min="1">
                </div>
                <div class="form-group">
                    <label>📏 Longitud (m)</label>
                    <input type="number" name="longitud" value="20" min="1">
                </div>
                <div class="form-group">
                    <label>🔌 Tensión (V)</label>
                    <input type="number" name="tension" value="230">
                </div>
                <div class="form-group">
                    <label>⚡ Factor de potencia</label>
                    <input type="number" name="fp" value="0.8" step="0.01" min="0.5" max="1">
                </div>
                <div class="form-group">
                    <label>🏢 Tipo instalación</label>
                    <select name="tipo_instalacion">
                        <option value="vivienda">Vivienda</option>
                        <option value="concurrencia">Pública concurrencia</option>
                        <option value="industrial">Industrial</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn">⚡ Calcular</button>
        </form>
        
        {% if resultado_circuito %}
        <div class="result-box">
            <div class="result-item">
                <span class="result-label">Intensidad</span>
                <span class="result-value highlight">{{ resultado_circuito.intensidad }} A</span>
            </div>
            <div class="result-item">
                <span class="result-label">Sección</span>
                <span class="result-value highlight">{{ resultado_circuito.seccion }} mm²</span>
            </div>
            <div class="result-item">
                <span class="result-label">PIA</span>
                <span class="result-value">{{ resultado_circuito.pia }} A</span>
            </div>
        </div>
        {% endif %}
        
        <div class="nav">
            <a href="/vivienda">🏠 Vivienda</a>
            <a href="/edificio">🏢 Edificio</a>
            <a href="/di">🔌 DI</a>
            <a href="/ejercicios">📝 Ejercicios</a>
            <a href="/proyecto">📋 Proyecto</a>
            <a href="/buscar">🔍 Buscar</a>
        </div>
    </div>
</body>
</html>
