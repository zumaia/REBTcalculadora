<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REBT Calculator - Proyecto</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-primary: #0f0f23; --bg-secondary: #1a1a2e; --bg-card: #16213e; --accent: #00d4ff; --accent-hover: #00a8cc; --accent-secondary: #7c3aed; --text-primary: #ffffff; --text-secondary: #94a3b8; --text-muted: #64748b; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; margin-bottom: 8px; color: var(--accent); }
        h1 a { color: inherit; text-decoration: none; }
        h2 { color: var(--accent); margin-bottom: 16px; }
        .info-box { background: var(--bg-secondary); padding: 16px; border-radius: 12px; margin-bottom: 16px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 13px; color: var(--text-secondary); }
        input, select { background: var(--bg-secondary); border: 1px solid var(--text-muted); border-radius: 8px; padding: 10px; color: var(--text-primary); font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: var(--accent); }
        .btn { background: var(--accent); border: none; border-radius: 8px; padding: 12px 24px; color: var(--bg-primary); font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; }
        .nav { display: flex; justify-content: center; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
        .nav a { background: var(--bg-secondary); padding: 10px 16px; border-radius: 8px; color: var(--text-secondary); text-decoration: none; }

    </style>
</head>
<body>
    <div class="container">
        <h1><a href="/">REBT Calculator</a></h1>
        
        
        <h2>📋 Generador de Proyectos</h2>
        
        <div class="info-box">
            <p>Generación completa de proyectos eléctricos según REBT.</p>
        </div>
        
        <form method="POST" action="/generar-proyecto">
            <div class="form-grid">
                <div class="form-group">
                    <label>Tipo</label>
                    <select name="tipo">
                        <option value="vivienda">Vivienda</option>
                        <option value="oficina">Oficina</option>
                        <option value="local">Local comercial</option>
                        <option value="nave">Nave industrial</option>
                        <option value="bar">Bar/Restaurante</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Potencia (W)</label>
                    <input type="number" name="potencia" value="5000" min="100">
                </div>
                <div class="form-group">
                    <label>Superficie (m²)</label>
                    <input type="number" name="superficie" value="80" min="10">
                </div>
                <div class="form-group">
                    <label>Longitud acometida (m)</label>
                    <input type="number" name="longitud" value="15" min="1">
                </div>
            </div>
            <button type="submit" class="btn">📥 Generar Proyecto</button>
        </form>
        
        <div class="nav">
            <a href="/vivienda" title="Circuitos de Vivienda (ITC-BT-25)">🏠</a>
            <a href="/edificio" title="Edificio Residencial">🏢</a>
            <a href="/circuito" title="Cálculo de Circuito">⚡</a>
            <a href="/di" title="Derivación Individual">🔌</a>
            <a href="/calc_seccion" title="Sección de Cable">📏</a>
            <a href="/calc_caida" title="Caída de Tensión">📉</a>
            <a href="/calc_proteccion" title="Protecciones">🛡️</a>
            <a href="/calc_solar" title="Paneles Solares">☀️</a>
            <a href="/calc_baterias_solares" title="Baterías Solares">🔋</a>
            <a href="/calc_consumo_diario" title="Consumo Diario">⚡</a>
            <a href="/calc_divisor" title="Divisor de Tensión">🔗</a>
            <a href="/calc_fp" title="Factor de Potencia">📊</a>
            <a href="/calc_rparalelo" title="Resistencias en Paralelo">🔀</a>
            <a href="/calc_costo" title="Coste de Instalación">💰</a>
            <a href="/calc_icc_simplificado" title="Cortocircuito Simplificado">⚡</a>
            <a href="/calc_icc_impedancias" title="Cortocircuito por Impedancias">⚡</a>
            <a href="/calc_tierra" title="Toma de Tierra">🌍</a>
            <a href="/calc_longitud_max" title="Longitud Máxima">📏</a>
            <a href="/calc_picas" title="Número de Picas">🌍</a>
            <a href="/calc_potencia_elec" title="Potencia Eléctrica">⚡</a>
            <a href="/calc_rconductor" title="Resistencia de Conductor">🔧</a>
            <a href="/calc_seccion_pot_dist" title="Sección por Potencia">📏</a>
            <a href="/calc_seccion_caida_dist" title="Sección por Caída">📏</a>
            <a href="/calc_ohm" title="Ley de Ohm">⚡</a>
            <a href="/calc_codigo_colores" title="Código de Colores">🎨</a>
            <a href="/ejercicios" title="Ejercicios">📝</a>
            <a href="/proyecto" class="active" title="Proyecto Eléctrico">📋</a>
            <a href="/buscar" title="Buscar en REBT">🔍</a>
        </div>
    </div>
</body>
</html>
