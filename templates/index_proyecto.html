<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REBT Calculator - Proyecto</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-primary: #0f0f23; --bg-secondary: #1a1a2e; --bg-card: #16213e; --accent: #00d4ff; --text-primary: #ffffff; --text-secondary: #94a3b8; --text-muted: #64748b; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; margin-bottom: 8px; color: var(--accent); }
        h1 a { color: inherit; text-decoration: none; }
        h2 { color: var(--accent); margin-bottom: 16px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 13px; color: var(--text-secondary); }
        input, select { background: var(--bg-secondary); border: 1px solid var(--text-muted); border-radius: 8px; padding: 10px; color: var(--text-primary); font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: var(--accent); }
        .btn { background: var(--accent); border: none; border-radius: 8px; padding: 12px 24px; color: var(--bg-primary); font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; }
        .nav { display: flex; justify-content: center; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
        .nav a { background: var(--bg-secondary); padding: 10px 16px; border-radius: 8px; color: var(--text-secondary); text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1><a href="/">REBT Calculator</a></h1>
        <h2>📋 Generador de Proyectos</h2>
        
        <form method="POST" action="/generar-proyecto">
            <div class="form-grid">
                <div class="form-group">
                    <label>Tipo</label>
                    <select name="tipo">
                        <option value="vivienda">Vivienda</option>
                        <option value="oficina">Oficina</option>
                        <option value="local">Local comercial</option>
                        <option value="nave">Nave industrial</option>
                        <option value="bar">Bar/Restaurante</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Potencia (W)</label>
                    <input type="number" name="potencia" value="5000" min="100">
                </div>
                <div class="form-group">
                    <label>Superficie (m²)</label>
                    <input type="number" name="superficie" value="80" min="10">
                </div>
                <div class="form-group">
                    <label>Longitud acometida (m)</label>
                    <input type="number" name="longitud" value="15" min="1">
                </div>
            </div>
            <button type="submit" class="btn">📥 Generar Proyecto</button>
        </form>
        
        <div class="nav">
            <a href="/vivienda">🏠 Vivienda</a>
            <a href="/edificio">🏢 Edificio</a>
            <a href="/circuito">⚡ Circuito</a>
            <a href="/di">🔌 DI</a>
            <a href="/ejercicios">📝 Ejercicios</a>
            <a href="/buscar">🔍 Buscar</a>
        </div>
    </div>
</body>
</html>
