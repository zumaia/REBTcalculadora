<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REBT Calculator - DI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-primary: #0f0f23; --bg-secondary: #1a1a2e; --bg-card: #16213e; --accent: #00d4ff; --text-primary: #ffffff; --text-secondary: #94a3b8; --text-muted: #64748b; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; margin-bottom: 8px; color: var(--accent); }
        h1 a { color: inherit; text-decoration: none; }
        h2 { color: var(--accent); margin-bottom: 16px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 13px; color: var(--text-secondary); }
        input { background: var(--bg-secondary); border: 1px solid var(--text-muted); border-radius: 8px; padding: 10px; color: var(--text-primary); font-size: 14px; }
        input:focus { outline: none; border-color: var(--accent); }
        .checkbox-item { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
        .checkbox-item input { width: 18px; height: 18px; }
        .btn { background: var(--accent); border: none; border-radius: 8px; padding: 12px 24px; color: var(--bg-primary); font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; }
        .result-box { background: var(--bg-secondary); padding: 16px; border-radius: 12px; margin-top: 16px; }
        .result-item { display: flex; justify-content: space-between; padding: 8px 0; }
        .result-label { color: var(--text-secondary); }
        .result-value.highlight { color: var(--accent); font-weight: 600; }
        .nav { display: flex; justify-content: center; gap: 8px; margin-top: 20px; }
        .nav a { background: var(--bg-secondary); padding: 10px 16px; border-radius: 8px; color: var(--text-secondary); text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1><a href="/">REBT Calculator</a></h1>
        <h2>🔌 Derivación Individual</h2>
        
        <form method="POST" action="/calcular-di">
            <div class="form-grid">
                <div class="form-group">
                    <label>⚡ Potencia (W)</label>
                    <input type="number" name="potencia" value="5000" min="1">
                </div>
                <div class="form-group">
                    <label>📏 Longitud (m)</label>
                    <input type="number" name="longitud" value="15" min="1">
                </div>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" name="es_trifasica" id="es_trifasica">
                <label for="es_trifasica">Trifásica (400V)</label>
            </div>
            <p style="color: var(--text-muted); font-size: 11px; margin-bottom: 12px;">Sin marcar: Monofásica (230V)</p>
            <button type="submit" class="btn">⚡ Calcular DI</button>
        </form>
        
        {% if resultado_di %}
        <div class="result-box">
            <div class="result-item">
                <span class="result-label">Intensidad</span>
                <span class="result-value">{{ resultado_di.intensidad }} A</span>
            </div>
            <div class="result-item">
                <span class="result-label">Sección</span>
                <span class="result-value highlight">{{ resultado_di.seccion }} mm²</span>
            </div>
            <div class="result-item">
                <span class="result-label">IGA</span>
                <span class="result-value">{{ resultado_di.iga }} A</span>
            </div>
        </div>
        {% endif %}
        
        <div class="nav">
            <a href="/vivienda">🏠 Vivienda</a>
            <a href="/edificio">🏢 Edificio</a>
            <a href="/circuito">⚡ Circuito</a>
            <a href="/ejercicios">📝 Ejercicios</a>
            <a href="/proyecto">📋 Proyecto</a>
            <a href="/buscar">🔍 Buscar</a>
        </div>
    </div>
</body>
</html>
