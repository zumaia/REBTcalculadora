<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REBT Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-primary: #0f0f23; --bg-secondary: #1a1a2e; --bg-card: #16213e; --accent: #00d4ff; --text-primary: #ffffff; --text-secondary: #94a3b8; --text-muted: #64748b; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; margin-bottom: 8px; }
        h1 a { color: var(--accent); text-decoration: none; }
        .subtitle { text-align: center; font-size: 12px; color: var(--text-muted); margin-bottom: 20px; }
        .nav { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .nav a { background: var(--bg-secondary); padding: 10px 16px; border-radius: 8px; color: var(--text-secondary); text-decoration: none; font-size: 14px; transition: all 0.2s; }
        .nav a:hover { color: var(--accent); border-color: var(--accent); }
        .nav a.active { background: var(--accent); color: var(--bg-primary); }
        .credits { text-align: center; margin-top: 30px; font-size: 12px; color: var(--text-muted); }
        .credits a { color: var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <h1><a href="/">REBT Calculator</a></h1>
        <p class="subtitle">ITC-BT-25 Viviendas | ITC-BT-10 Edificios | ITC-BT-19 Sección cables</p>
        
        <div class="nav">
            <a href="/vivienda">🏠 Vivienda</a>
            <a href="/edificio">🏢 Edificio</a>
            <a href="/circuito">⚡ Circuito</a>
            <a href="/di">🔌 DI</a>
            <a href="/ejercicios">📝 Ejercicios</a>
            <a href="/proyecto">📋 Proyecto</a>
            <a href="/buscar">🔍 Buscar</a>
        </div>
        
        <div class="credits">
            <a href="/">REBT Calculator</a>
            <span>• ITC-BT-25 • ITC-BT-10 • ITC-BT-19</span>
        </div>
    </div>
</body>
</html>
